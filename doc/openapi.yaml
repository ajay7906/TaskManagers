openapi: 3.0.3
info:
  title: Task Manager API
  version: "1.0.0"
  description: |
    Complete RESTful backend for Task Management.
    Includes JWT authentication, RBAC, task CRUD, task assignment,
    real-time updates, analytics, Redis caching, full-text search,
    role-based rate limiting, and complete OpenAPI documentation.

servers:
  - url: https://taskmanagers-t2xn.onrender.com
    description: Production server
  - url: http://localhost:4000
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PageParam:
      name: page
      in: query
      schema: { type: integer, default: 1 }
      description: Page number
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, default: 20 }
      description: Items per page
    SortByParam:
      name: sortBy
      in: query
      schema: { type: string, default: createdAt }
      description: Field to sort by
    OrderParam:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
        default: desc
    StatusParam:
      name: status
      in: query
      schema:
        type: string
        enum: [todo, in-progress, done]
    PriorityParam:
      name: priority
      in: query
      schema:
        type: string
        enum: [low, medium, high]
    QParam:
      name: q
      in: query
      schema: { type: string }
      description: Full-text search query

  schemas:

    # ========= USER SCHEMA ==========
    User:
      type: object
      properties:
        id: { type: string, example: 6730fab21c4f3e1823a7f122 }
        username: { type: string, example: johndoe }
        email: { type: string, example: johndoe@example.com }
        roles:
          type: array
          items: { type: string }
          example: ["user"]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ========= TASK SCHEMA ==========
    Task:
      type: object
      properties:
        _id: { type: string, example: 6730fbb41c4f3e1823a7f123 }
        title: { type: string, example: Fix login bug }
        description: { type: string, example: Users unable to login intermittently }
        dueDate: { type: string, format: date-time }
        priority:
          type: string
          enum: [low, medium, high]
          example: high
        status:
          type: string
          enum: [todo, in-progress, done]
          example: todo
        creator: { $ref: '#/components/schemas/User' }
        assignee: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ========= TOKEN SCHEMA ==========
    Tokens:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }

    # ========= ERROR RESPONSE ==========
    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        errors:
          type: array
          items: { type: object }

    # ========= REGISTER BODY (UPDATED) ==========
    RegisterBody:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          example: adminUser
        email:
          type: string
          format: email
          example: admin@example.com
        password:
          type: string
          example: StrongPass123!
        roles:
          type: array
          description: |
            Roles assigned by the frontend during registration.
            Accepted values: "admin", "manager", "user".
            ⚠ WARNING: Allowing admin creation from frontend is unsafe in production.
          items:
            type: string
          example: ["admin"]

    # ========= LOGIN BODY ==========
    LoginBody:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          example: adminUser
        password:
          type: string
          example: StrongPass123!

    # ========= CREATE TASK BODY ==========
    CreateTaskBody:
      type: object
      required: [title]
      properties:
        title: { type: string, example: Fix login bug }
        description: { type: string }
        dueDate: { type: string, format: date-time }
        priority:
          type: string
          enum: [low, medium, high]
          example: high
        assignee:
          type: string
          example: 6730123492acd2b3c4d93231

    AssignBody:
      type: object
      required: [assignee]
      properties:
        assignee: { type: string, example: 6730123492acd2b3c4d93231 }

paths:

  # =============== AUTH ROUTES ===============

  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      description: |
        Creates a new user.
        Frontend may send "roles" array such as ["admin"], ["manager"], ["user"].

       
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterBody' }

      responses:
        "201":
          description: Successfully registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginBody' }
      responses:
        "200":
          description: Login success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  user: { $ref: '#/components/schemas/User' }
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/auth/refresh:
    post:
      summary: Refresh token
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New tokens generated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tokens' }

  /api/auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Logged out

  /api/auth/me:
    get:
      summary: Get current user profile
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }

  # =============== TASK ROUTES ===============

  /api/tasks:
    get:
      summary: List tasks with filtering, sorting, pagination, search
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/SortByParam'
        - $ref: '#/components/parameters/OrderParam'
        - $ref: '#/components/parameters/StatusParam'
        - $ref: '#/components/parameters/PriorityParam'
        - $ref: '#/components/parameters/QParam'
      responses:
        "200":
          description: Task list
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/Task' }
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }

    post:
      summary: Create a new task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskBody' }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  /api/tasks/{id}:
    get:
      summary: Get single task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Task retrieved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

    put:
      summary: Update task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

    delete:
      summary: Delete task
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Deleted

  /api/tasks/{id}/assign:
    post:
      summary: Assign task to user
      tags: [Tasks]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignBody' }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }

  # =============== ANALYTICS ROUTES ===============

  /api/analytics/overview:
    get:
      summary: Analytics overview
      tags: [Analytics]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Overview data
          content:
            application/json:
              schema:
                type: object
                properties:
                  byStatus:
                    type: array
                    items:
                      type: object
                      properties:
                        _id: { type: string }
                        count: { type: integer }
                  overdue:
                    type: integer

  /api/analytics/by-user:
    get:
      summary: Grouped analytics by user
      tags: [Analytics]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
